spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:promo_engine}
spring.datasource.username=${DB_USER:promo}
spring.datasource.password=${DB_PASSWORD:promo}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=localhost
spring.data.redis.port=6379

app.jwt.private-key=classpath:certs/private.pem
app.jwt.public-key=classpath:certs/public.pem
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d
